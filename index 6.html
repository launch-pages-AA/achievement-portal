<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>بوابة الإنجاز الرقمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one centered portrait column (like the PDF mockups) over a black field lit by a purple glow top-right and a green glow bottom-left. */
:root{
  --bg:#000000;
  --fg:#ffffff;
  --muted:#c9c7d1;
  --purple:#7b2ff2;
  --purple-soft:#b79cff;
  --green:#3fe24a;
  --green-deep:#1f7a26;
  --card:#26262b;
  --card-2:#2c2c31;
  --line:#55555c;
  --star:#f6c22b;
  --star-off:#7b7b80;
  --nav:#ffffff;
  --nav-fg:#151418;
  --font:"Readex Pro",Tahoma,sans-serif;
  --num:"Arial","Helvetica Neue",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);min-height:100vh;overflow-x:hidden}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60vmax 45vmax at 100% 0%, rgba(98,62,160,.55), rgba(60,35,110,.18) 45%, transparent 70%),
   radial-gradient(55vmax 45vmax at 0% 100%, rgba(40,140,50,.55), rgba(25,90,35,.2) 45%, transparent 72%),
   var(--bg)}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:40px 28px;display:flex;flex-direction:column;min-height:100vh}
main{flex:1}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;direction:ltr;font-weight:800;font-size:clamp(22px,4.4vw,30px);letter-spacing:-.01em;font-family:var(--font)}
.brand img{width:40px;height:40px}
.brand .ai{color:var(--green)}
.dept{font-size:14px;color:var(--fg)}
.hero{margin-top:30px;position:relative}
.hero h1{margin:0;font-weight:400;font-size:clamp(34px,7.4vw,50px);line-height:1.25;text-wrap:balance}
.hero h1 .hl{padding:0 8px 0 .3em;border-radius:4px;
  background:linear-gradient(to left,var(--purple) 0%,var(--purple) 46%,rgba(123,47,242,.35) 78%,rgba(123,47,242,0) 100%)}
.hero p{margin:6px 0 0;font-size:13px;color:var(--fg)}
.pix{position:absolute;width:32px;height:42px}
.pix i{position:absolute;width:15px;height:15px}
.hero .pix{left:-28px;top:58px}
.pix .a{background:var(--purple);left:15px;top:0}
.pix .b{background:#fff;left:0;top:13px}
.pix .c{background:var(--green);left:15px;top:27px}
.pix2{position:fixed;right:max(36px,6vw);bottom:60px;width:40px;height:36px;z-index:0}
.pix2 i{position:absolute;width:19px;height:18px}
.pix2 .a{background:#fff;right:0;top:0}.pix2 .b{background:var(--green);right:19px;top:18px}
@media (max-width:760px){.hero .pix{display:none}.pix2{display:none}}

/* nav */
.nav{margin-top:34px;background:var(--nav);border-radius:6px;display:flex;align-items:center;padding:4px 6px;gap:4px}
.nav .tabs{display:flex;flex:1;justify-content:space-around;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}.nav .tabs::-webkit-scrollbar{display:none}
.nav button{font:inherit;border:0;background:none;color:var(--nav-fg);font-weight:700;font-size:14px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.nav .tab[aria-selected="true"]{background:radial-gradient(closest-side, rgba(156,110,255,.55), rgba(156,110,255,.18) 70%, transparent);color:#3a1c86}
.nav .icon{display:grid;place-items:center;padding:6px}
.nav .icon svg{width:20px;height:20px;stroke:var(--nav-fg)}
.nav button:focus-visible,.btn:focus-visible,.chip:focus-visible,.link:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (max-width:480px){.nav button{font-size:12.5px;padding:6px 6px}}

/* login */
.login{margin:56px auto 0;max-width:500px;background:var(--card);border:1px solid var(--line);border-radius:34px;padding:40px 28px 34px;text-align:center}
.login label{display:block;font-weight:700;font-size:19px;margin-bottom:20px}
.login input{width:100%;max-width:272px;height:50px;border-radius:8px;border:1px solid #5a5a60;background:#343438;color:var(--fg);text-align:center;font-size:17px;font-family:var(--num)}
.login input::placeholder{color:#8e8e93}
.login .btn-go{display:block;margin:13px auto 0;width:100%;max-width:272px;height:50px;border-radius:8px;border:0;background:var(--green);color:#0b1a0c;font:inherit;font-size:18px;cursor:pointer}
.login .btn-go:hover{filter:brightness(1.07)}
.login .err{color:#ff9a9a;font-size:13px;min-height:20px;margin-top:12px}
.login .demo{margin-top:6px;font-size:12px;color:var(--muted)}
.login .demo button{font:inherit;background:none;border:0;color:var(--green);cursor:pointer;text-decoration:underline;font-family:var(--num);padding:0 2px}
.foot{text-align:center;font-size:14px;margin-top:34px}

/* welcome */
.welcome{margin-top:12px;border-radius:8px;overflow:hidden;position:relative;min-height:84px;display:flex;flex-direction:column;justify-content:center;padding:14px 22px;
  background:linear-gradient(to left, rgba(10,8,18,.25), rgba(10,8,18,.0) 60%), var(--banner) center/cover}
.welcome h2{margin:0;font-weight:800;font-size:clamp(20px,4.4vw,26px)}
.welcome .role{font-size:14px;margin-top:2px;padding-inline-start:40%}
@media (max-width:480px){.welcome .role{padding-inline-start:0}}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin-top:18px}
.stat{background:var(--card-2);border:2px solid var(--green);border-radius:30px;padding:12px 22px 14px;text-align:right;color:var(--fg);font:inherit;cursor:pointer;display:block;width:100%}
.stat.p{border-color:var(--purple)}
.stat:hover{transform:translateY(-1px)}
.stat .lab{font-size:clamp(14px,3.4vw,19px);display:flex;align-items:center;gap:6px;justify-content:flex-start}
.stat .lab svg{width:13px;height:13px;stroke:var(--fg);flex:none}
.stat .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;padding-inline:14px 6px}
.stat .val{font-weight:800;font-size:clamp(24px,5vw,30px);font-family:var(--font);font-variant-numeric:tabular-nums}
.stat .ico{width:30px;height:30px;flex:none}
@media (max-width:480px){.stats{gap:12px}.stat{padding:10px 14px;border-radius:24px}.stat .row{padding-inline:4px 0}}

/* sections */
.sec-title{font-weight:800;font-size:clamp(19px,4vw,23px);margin:30px 0 12px;padding-inline-start:30px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 0;padding-inline-start:0}
.chip{font:inherit;font-size:13px;color:var(--fg);background:#1d1d20;border:2px solid var(--green);border-radius:999px;padding:5px 16px;cursor:pointer;min-width:112px}
.chip[aria-pressed="true"]{background:var(--purple);border-color:#fff}
.list{display:flex;flex-direction:column;gap:22px;margin-top:40px}
.list.tight{margin-top:14px}

/* achievement card */
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 22px 14px;position:relative}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:var(--green);color:#0b1a0c;font-weight:700;font-size:12.5px;border-radius:12px;padding:4px 16px}
.pill.lead{background:var(--purple-soft);color:#1b0d3d}
.date{font-family:var(--num);font-size:13px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.card .body{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:10px;margin-top:4px}
.card h3{margin:0;font-weight:700;font-size:clamp(17px,3.8vw,21px);padding-bottom:6px;border-bottom:1px solid #8a8a90;line-height:1.5}
.fields{display:flex;flex-direction:column;gap:7px;margin-top:10px;font-size:14px}
.f{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.f b{font-weight:700;white-space:nowrap}
.f span{color:#dddbe3;min-width:0}
.f .date{font-size:13px}
.team{color:var(--green);font-weight:600}
.rule{height:1px;background:#8a8a90;margin:6px 0 2px}
.stars{display:inline-flex;gap:2px;direction:ltr;vertical-align:-2px}
.stars svg{width:17px;height:17px}
.side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px}
.stamp{width:64px;margin-top:8px}
.pending{margin-top:28px;font-size:12px;color:#ffd27a;border:1px dashed #ffd27a;border-radius:10px;padding:4px 8px;text-align:center}
.link{font:inherit;background:none;border:0;color:var(--fg);font-size:12px;cursor:pointer;padding:4px}
.link:hover{text-decoration:underline}
@media (max-width:520px){.card{padding:12px 16px 14px;border-radius:22px}.card .body{grid-template-columns:minmax(0,1fr) 72px}.stamp{width:54px}}

/* titles */
.titles-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:32px;flex-wrap:wrap}
.count{background:var(--card-2);border:2px solid var(--purple);border-radius:28px;padding:10px 26px 12px;display:flex;align-items:center;gap:40px;min-width:min(290px,100%)}
.count .lab{font-size:18px}
.count .val{font-weight:800;font-size:32px;text-align:center}
.count img{width:36px}
.sel{position:relative}
.sel select{appearance:none;font:inherit;font-size:13px;color:var(--fg);background:#26262b;border:2px solid var(--purple);border-radius:10px;padding:3px 30px 3px 48px;cursor:pointer;min-width:146px}
.sel svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--fg);pointer-events:none}
.tile{position:relative;border-radius:22px;overflow:hidden;min-height:104px;display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;padding:14px 22px;
  background:linear-gradient(to left, rgba(0,0,0,.35), rgba(0,0,0,.05)), var(--tile);background-size:100% 100%,cover;background-position:center;background-repeat:no-repeat}
.tile h4{margin:0;font-weight:800;font-size:clamp(17px,4vw,22px);padding-bottom:8px;border-bottom:1px solid #9d9da3;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tile .date{display:block;margin-top:10px;margin-inline-start:20%}
.tile .who{font-size:13px;color:var(--muted);margin-top:6px}
.tile img{width:64px;justify-self:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.empty{color:var(--muted);text-align:center;padding:30px 0}
@media (max-width:520px){.tile{grid-template-columns:minmax(0,1fr) 80px;padding:12px 16px}.tile img{width:54px}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(1px);z-index:20;display:grid;place-items:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:34px;width:min(510px,100%);padding:44px 28px 26px;text-align:center;position:relative}
.qr{width:min(300px,70vw);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.qr img,.qr canvas{width:100%!important;height:auto!important;image-rendering:pixelated}
.modal p{font-size:13px;margin:14px 0 26px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.btn{font:inherit;font-weight:700;font-size:14px;color:var(--fg);background:transparent;border:2px solid var(--green);border-radius:999px;height:60px;display:flex;align-items:center;justify-content:center;gap:16px;cursor:pointer}
.btn.pu{border-color:var(--purple)}
.btn svg{width:24px;height:24px}
.close{position:absolute;top:14px;left:18px;font:inherit;font-size:22px;background:none;border:0;color:var(--muted);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#fff;color:#111;padding:9px 18px;border-radius:999px;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.public{display:inline-block;margin-top:10px;font-size:12px;color:var(--muted);border:1px solid #444;border-radius:999px;padding:2px 12px}
.emptybox{background:var(--card);border:1px dashed #5d5d66;border-radius:30px;padding:30px 24px;text-align:center}
.emptybox .eicon{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:rgba(63,226,74,.08);border:1px solid rgba(63,226,74,.35)}
.emptybox .eicon .ico{width:30px;height:30px}
.emptybox .eimg{width:46px;opacity:.85;margin-bottom:8px}
.emptybox h3{margin:0 0 6px;font-size:18px;font-weight:700;text-wrap:balance}
.emptybox p{margin:0 auto;max-width:44ch;color:var(--muted);font-size:14px;line-height:1.8}
.emptybox.small{padding:24px 20px}
.steps{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;counter-reset:s}
.steps li{counter-increment:s;background:#1e1e22;border:1px solid #3c3c43;border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.steps li::before{content:counter(s);font-family:var(--num);font-weight:700;color:#0b1a0c;background:var(--green);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin:0 auto 4px;font-size:12px}
.steps b{color:var(--fg);font-size:14px}
.notice{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;font:inherit;font-size:13.5px;text-align:right;color:#ffe2a1;background:rgba(246,194,43,.08);border:1px solid rgba(246,194,43,.45);border-radius:14px;padding:10px 14px;cursor:pointer}
.notice .dot,.tdot{width:8px;height:8px;border-radius:50%;background:#f6c22b;flex:none}
.testbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.testbar .tsc{color:var(--fg);font-weight:600}
.tswitch{margin-inline-start:auto}
.tswitch select{font:inherit;font-size:12px;color:var(--fg);background:#1d1d20;border:1px solid #4a4a52;border-radius:8px;padding:3px 8px;max-width:230px}
.accounts{margin-top:40px}
.accounts h2{font-size:19px;font-weight:800;margin:0 0 14px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.acc{font:inherit;text-align:right;color:var(--fg);background:rgba(38,38,43,.85);border:1.5px solid #44444b;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:border-color .15s,transform .15s}
.acc:hover{border-color:var(--green);transform:translateY(-2px)}
.acc.lead:hover{border-color:var(--purple-soft)}
.acc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.acc-tag{font-size:11.5px;font-weight:700;background:var(--green);color:#0b1a0c;border-radius:8px;padding:2px 9px}
.acc.lead .acc-tag{background:var(--purple-soft);color:#1b0d3d}
.acc-id{font-family:var(--num);font-size:13px;color:var(--muted);letter-spacing:.04em}
.acc-name{font-weight:700;font-size:16px;margin-top:4px}
.acc-desc{font-size:12.5px;color:#dddbe3}
.acc-meta{font-size:11.5px;color:var(--muted)}
.preview{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:#ffe2a1;border:1px solid rgba(246,194,43,.4);border-radius:999px;padding:2px 12px}
@media (max-width:480px){.steps{grid-template-columns:1fr}.tswitch{margin-inline-start:0;width:100%}.tswitch select{max-width:100%;width:100%}}
.stat:not(.exp){cursor:default}.stat:not(.exp):hover{transform:none}
.stat .arr{display:inline-grid;transition:transform .2s}.stat[aria-expanded="true"] .arr{transform:rotate(180deg)}
.brk{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed #4a4a52}
.brk span{font-size:13px;background:#1b1b1f;border:1px solid #3d3d45;border-radius:999px;padding:3px 12px;display:inline-flex;gap:6px;align-items:center}
.brk b{font-family:var(--num);font-size:14px}
.desc{color:#d9d7e0;font-size:13.5px;line-height:1.75;margin:8px 0 0}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.mchips:empty{display:none}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:#1c1c20;border:1px solid #3d3d45;border-radius:999px;padding:4px 11px;color:#e6e4ec;line-height:1.4}
.mchip.ok{border-color:rgba(63,226,74,.55);color:#a6f5ab}.mchip.late{border-color:rgba(246,194,43,.55);color:#ffe2a1}
.mchip.res{background:rgba(123,47,242,.28);border-color:var(--purple-soft);color:#efe7ff;font-weight:600}.mchip.team{color:#a6f5ab}
.mi{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rates{display:grid;grid-template-columns:max-content max-content max-content;gap:6px 12px;margin-top:14px;font-size:13.5px;align-items:center;padding:10px 12px;background:#1f1f23;border-radius:14px;width:fit-content;max-width:100%}
.rates b{font-weight:600}.rates .n{font-family:var(--num);color:var(--muted);font-size:12px}
.deliv{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px 12px;background:linear-gradient(to left,rgba(63,226,74,.11),rgba(123,47,242,.13));border:1px solid #4a4a55;border-radius:16px;color:var(--fg);font:inherit;text-align:right;cursor:pointer;transition:border-color .15s}
.deliv:hover{border-color:var(--green)}
.dthumb{width:58px;height:42px;object-fit:cover;border-radius:9px;flex:none;border:1px solid #555}
.dico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#18181b;border:1px solid #44444c;flex:none}
.dico svg{width:21px;height:21px;stroke:var(--green);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dtxt{display:flex;flex-direction:column;min-width:0;flex:1}.dtxt small{font-size:11px;color:var(--muted)}
.dtxt b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dact{font-size:12px;color:var(--green);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.dact svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin-top:12px}
.dtile{background:#1c1c20;border:1px solid #3a3a42;border-radius:12px;padding:8px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dtile small{font-size:11px;color:var(--muted)}.dtile b{font-size:13px;font-weight:600}
.impact{margin-top:12px;font-size:13.5px;line-height:1.7;background:rgba(63,226,74,.07);border:1px solid rgba(63,226,74,.35);padding:9px 13px;border-radius:12px;display:flex;flex-direction:column}
.impact small{font-size:11px;color:#a6f5ab}
.modal.wide{width:min(720px,100%);padding:44px 18px 18px}.lb{width:100%;border-radius:16px}
.mh{margin:0 0 6px;font-size:20px}.msub{margin:0 auto 18px!important;max-width:46ch;color:var(--muted);line-height:1.8}
.xopts{display:flex;flex-direction:column;gap:12px;text-align:right}
.xopt{display:flex;gap:14px;align-items:center;font:inherit;color:var(--fg);background:#1d1d21;border:1.5px solid #45454d;border-radius:18px;padding:14px 16px;cursor:pointer}
.xopt:hover{border-color:var(--green)}.xopt b{display:block;font-size:15px}.xopt small{color:var(--muted);font-size:12.5px;line-height:1.6}
.xi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(123,47,242,.2);flex:none}
.xi svg{width:22px;height:22px;stroke:var(--purple-soft);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#printArea{display:none}
@media print{
 @page{size:A4;margin:14mm}
 html,body{background:#fff!important;color:#141218!important}
 .glow,.pix2,.wrap,.scrim,.toast{display:none!important}
 #printArea{display:block!important;font-family:var(--font);color:#141218}
 .pa-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:3px solid #7b2ff2;padding-bottom:12px}
 .pa-brand{font-weight:800;font-size:20px;direction:ltr;text-align:right}.pa-brand span{color:#22a82c}
 .pa-h h1{margin:4px 0;font-size:26px}.pa-h p{margin:2px 0;font-size:13px}.pa-m{color:#666}
 .pa-qr{text-align:center}.pa-qr img,.pa-qr canvas{width:92px!important;height:92px!important}.pa-qr small{font-size:10px;color:#666}
 .pa-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
 .pa-stats div{border:1px solid #ddd;border-radius:10px;padding:8px 10px}.pa-stats small{display:block;font-size:11px;color:#555}
 .pa-stats b{font-size:20px}.pa-stats em{display:block;font-style:normal;font-size:10.5px;color:#666}
 #printArea h2{font-size:16px;margin:16px 0 8px;color:#5b1fc4}
 .pa-t{width:100%;border-collapse:collapse;font-size:11.5px}.pa-t th{background:#f1ecfb;text-align:right;padding:6px;border:1px solid #ddd}
 .pa-t td{padding:6px;border:1px solid #e3e3e3;vertical-align:top}.pa-t tr{break-inside:avoid}.pa-o{color:#1d7f25;font-size:10.5px;margin-top:2px}
 .pa-ti{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
 .pa-ti li{display:flex;gap:8px;align-items:center;border:1px solid #e3e3e3;border-radius:10px;padding:6px 8px;break-inside:avoid}
 .pa-ti img{width:34px}.pa-ti b{display:block;font-size:12px}.pa-ti .date{font-size:10.5px;color:#666}
 .pa-f{margin-top:18px;font-size:10.5px;color:#777;border-top:1px solid #ddd;padding-top:8px}
 .pa-e{color:#666}
}
.cover{display:block;position:relative;width:calc(100% + 52px);margin:-14px -26px 14px;height:170px;border:0;padding:0;border-radius:31px 31px 0 0;overflow:hidden;cursor:zoom-in;background:#121214}
.cover>img{width:100%;height:100%;object-fit:cover;object-position:center 38%;transition:transform .5s}
.cover:hover>img{transform:scale(1.04)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--card) 2%,rgba(38,38,43,0) 60%);pointer-events:none}
.cover.k-pdf{background:linear-gradient(120deg,#2a0f5c,#0d2a12)}.cover.k-pdf>img{object-position:center 12%}.cover.k-cert{background:radial-gradient(circle at 70% 30%,#3a1d73,#0d0d10)}.cover.k-cert>img{width:auto;height:88%;margin:14px auto 0;display:block;object-fit:contain;box-shadow:0 14px 30px rgba(0,0,0,.6);border-radius:4px;transform:rotate(-2deg)}.cover.k-cert:hover>img{transform:rotate(0) scale(1.03)}.cover.k-cert::after{background:linear-gradient(to top,var(--card) 0%,rgba(38,38,43,0) 35%)}.gtile.k-cert{padding:14px;background:radial-gradient(circle at 70% 20%,#3a1d73,#111114)}.gtile.k-cert>img{border-radius:4px;box-shadow:0 10px 24px rgba(0,0,0,.5)}

.stack{position:absolute;left:20px;top:18px;display:flex;z-index:1}
.stack img{width:58px;height:76px;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.5);margin-inline-start:-18px}
.stack img:nth-child(1){transform:rotate(6deg)}.stack img:nth-child(2){transform:rotate(-5deg)}
.cchip{position:absolute;z-index:1;bottom:14px;left:20px;display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;background:rgba(10,10,12,.72);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 11px;color:#fff}
.gal-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:30px}
.gal-head h2{margin:0;font-size:24px;font-weight:800}.gal-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.gstats{display:flex;gap:8px;flex-wrap:wrap}.gstats span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:#1d1d21;border:1px solid #3d3d45;border-radius:12px;padding:6px 10px;color:var(--muted)}
.gstats b{font-family:var(--num);color:var(--fg);font-size:15px}
.demo-note{font-size:12px;color:#ffe2a1;margin:14px 0 0}
.masonry{columns:3 190px;column-gap:14px;margin-top:16px}
.gtile{break-inside:avoid;display:block;position:relative;width:100%;margin:0 0 14px;padding:0;border:1px solid #3d3d45;border-radius:18px;overflow:hidden;background:#151518;cursor:zoom-in;font:inherit;color:#fff;text-align:right;transition:transform .2s,border-color .2s}
.gtile:hover{transform:translateY(-3px);border-color:var(--green)}
.gtile img{display:block;width:100%;height:auto}

.gov{position:static;padding:10px 12px 12px;background:#18181c;border-top:1px solid #2e2e35;display:flex;flex-direction:column;gap:2px}
.gov b{font-size:13.5px;line-height:1.5}.gov .date{font-size:11px;color:#c9c7d1}
.gtype{align-self:flex-start;display:inline-flex;gap:5px;align-items:center;font-size:11px;background:rgba(123,47,242,.75);border-radius:999px;padding:2px 9px;margin-bottom:4px}
.gtile.k-image .gtype{background:rgba(31,122,38,.85)}.gtile.k-link .gtype{background:rgba(60,60,70,.9)}
.modal.viewer{width:min(780px,100%);padding:22px 18px 18px;text-align:right}
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-inline-start:30px;margin-bottom:12px}.vhead h3{margin:0;font-size:17px}
.vstage{position:relative;display:grid;place-items:center;background:#141417;border-radius:18px;padding:14px;min-height:260px}
.vstage img{max-height:min(62vh,640px);max-width:100%;width:auto;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.vstage.pdf{background:repeating-linear-gradient(45deg,#1a1a1e 0 12px,#17171a 12px 24px)}.vstage.pdf img{border-radius:3px}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center}
.vnav svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.vprev{right:10px}.vnext{left:10px}.vnav:hover{background:var(--purple)}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.vcount{font-size:13px;color:var(--muted)}
.btn.small{height:40px;padding:0 16px;font-size:13px;gap:8px}.btn.small svg{width:15px;height:15px;stroke:var(--green);fill:none;stroke-width:2}
.vthumbs{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.vthumbs button{flex:none;width:52px;height:68px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:none;opacity:.6}
.vthumbs button[aria-current="true"]{border-color:var(--green);opacity:1}.vthumbs img{width:100%;height:100%;object-fit:cover}
.vnote{font-size:11.5px;color:var(--muted);margin:10px 0 0!important}
.vframe{width:100%;height:70vh;border:0;border-radius:12px;background:#fff}
.vstage.link img{max-height:50vh}
@media (max-width:520px){.cover{width:calc(100% + 36px);margin:-14px -18px 14px;height:140px;border-radius:25px 25px 0 0}.masonry{columns:2 140px;column-gap:10px}.gtile{margin-bottom:10px}}
.spot{position:relative;overflow:hidden;margin-top:28px;border-radius:30px;border:1px solid #5a3fa0;background:radial-gradient(circle at 50% 38%,#4a238f 0%,#1a0d33 45%,#0b0b0e 80%);padding:26px 20px 26px;text-align:center}
.spot.empty{border-color:#3d3d45;background:radial-gradient(circle at 50% 38%,#2b2b33,#0e0e11 70%)}
.rays{position:absolute;left:50%;top:44%;width:620px;height:620px;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.08) 0deg 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes floaty{50%{transform:translateY(-8px)}}
.spot .eyebrow{position:relative;display:inline-block;font-size:12px;font-weight:700;color:#0b1a0c;background:var(--green);border-radius:999px;padding:3px 14px}
.spot img{position:relative;display:block;width:150px;margin:14px auto 6px;filter:drop-shadow(0 14px 30px rgba(123,47,242,.65));animation:floaty 4s ease-in-out infinite}
.spot.empty img{width:90px;filter:grayscale(.3) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.spot h3{position:relative;margin:0;font-size:clamp(22px,5vw,28px);font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.spot p{position:relative;margin:6px 0 0;color:#d9cfff;font-size:14px}
.tstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.tstat{display:flex;align-items:center;gap:12px;background:var(--card-2);border:1.5px solid #46465a;border-radius:22px;padding:12px 14px;min-width:0}
.tstat small{display:block;font-size:12px;color:var(--muted)}.tstat b{font-size:24px;font-weight:800;font-family:var(--font)}.tstat b span{font-size:14px;color:var(--muted);font-weight:500}.tstat b.sm{font-size:14px}
.tstat img{width:34px}.ring{width:48px;height:48px;flex:none}.ring .rb{fill:none;stroke:#3a3a44;stroke-width:7}.ring .rf{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round}
.tico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(123,47,242,.2);color:var(--purple-soft);flex:none}.tico .mi{width:20px;height:20px}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.medal{position:relative;overflow:hidden;font:inherit;color:var(--fg);text-align:center;background:#1c1c21;border:1px solid #3a3a42;border-radius:22px;padding:16px 10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s,border-color .2s}
.medal.got{border-color:rgba(63,226,74,.5);background:radial-gradient(circle at 50% 25%,rgba(123,47,242,.42),#1c1c21 68%)}
.medal.got::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
.medal.got:hover::after{transform:translateX(120%)}
.medal:hover{transform:translateY(-3px)}
.mimg{position:relative;display:grid;place-items:center;width:88px;height:88px}
.medal img{width:84px;transition:transform .3s}.medal.got:hover img{transform:scale(1.08) rotate(-5deg)}
.medal.lock img{filter:grayscale(1) brightness(.35)}
.lk{position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(10,10,12,.85);border:1px solid #555;display:grid;place-items:center}
.lk svg,.tmodal svg{width:16px;height:16px;fill:none;stroke:#cfcfd6;stroke-width:1.8}
.medal b{font-size:13.5px;line-height:1.5;text-wrap:balance}.medal small{font-size:11.5px;color:var(--muted)}.medal.lock b{color:#9a98a3}
.times{position:absolute;top:10px;left:10px;font-family:var(--num);font-size:12px;font-weight:700;background:#f6c22b;color:#1a1200;border-radius:999px;padding:1px 8px}
.tl{list-style:none;margin:0;padding:0 0 0 0;border-inline-start:2px solid #3d3d48;margin-inline-start:10px}
.tm{position:relative;padding:0 22px 18px}
.tm::before{content:"";position:absolute;inset-inline-start:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 4px rgba(123,47,242,.25)}
.tmh{display:block;font-weight:800;font-size:15px;margin-bottom:8px}
.ti{display:flex;align-items:center;gap:12px;background:#1c1c21;border:1px solid #33333b;border-radius:16px;padding:8px 12px;margin-bottom:8px}
.ti img{width:42px}.ti b{display:block;font-size:14px}.ti .date{font-size:12px;color:var(--muted)}
.tmodal{position:relative;overflow:hidden;text-align:center;padding:10px 0 4px}
.tmodal img{position:relative;width:170px;filter:drop-shadow(0 14px 30px rgba(123,47,242,.6));animation:floaty 4s ease-in-out infinite}
.tmodal.locked img{filter:grayscale(1) brightness(.4)}
.tmodal h3{position:relative;margin:10px 0 4px;font-size:22px}.tmodal .how{position:relative;color:var(--muted);margin:0 auto 14px!important;max-width:36ch;line-height:1.8}
.tmodal .dates{position:relative;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tmodal .rays{top:40%}
@media (max-width:520px){.tstats{grid-template-columns:1fr 1fr}.tstats .tstat:last-child{grid-column:1/-1}.medals{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alum{display:inline-flex;align-items:center;margin-inline-start:10px;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:1px 10px;vertical-align:middle}
.alumni{margin-top:12px;border-radius:24px;border:1px solid #5a3fa0;background:linear-gradient(135deg,rgba(123,47,242,.25),rgba(63,226,74,.07));padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.al-text{display:flex;gap:12px;align-items:flex-start}
.al-lock{width:42px;height:42px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.al-lock svg{width:20px;height:20px;fill:none;stroke:#e5dbff;stroke-width:1.8}
.al-text b{font-size:16px}.al-text p{margin:4px 0 0;color:#dcd6ec;font-size:13.5px;line-height:1.75}
.exitcert{grid-column:2;grid-row:1/span 2;font:inherit;color:var(--fg);background:none;border:0;padding:0;cursor:zoom-in;display:flex;flex-direction:column;gap:8px;text-align:center}
.exitcert img{width:100%;border-radius:6px;box-shadow:0 12px 26px rgba(0,0,0,.55);transform:rotate(-2deg);transition:transform .3s}
.exitcert:hover img{transform:rotate(0) scale(1.03)}.exitcert b{font-size:13.5px}.exitcert small{display:block;color:var(--muted);font-size:11.5px}
.al-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn.pu.small svg{stroke:var(--purple-soft)}
@media (max-width:560px){.alumni{grid-template-columns:1fr}.exitcert{grid-column:auto;grid-row:auto}}
.card h3{font-size:clamp(16px,3.6vw,19px);padding-bottom:5px}
.card .side{justify-content:flex-start;gap:6px}
.rline{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px}
.rline span{display:inline-flex;align-items:center;gap:5px;background:#1f1f23;border-radius:999px;padding:3px 9px}.rline .stars{gap:1px}
.rline b{font-weight:500;color:#dcdae2}.rline .stars svg{width:12px;height:12px}
.details{margin-top:6px;padding-top:6px;border-top:1px dashed #44444c}
.dblock{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.dblock .dtile{padding:6px 10px;border-radius:10px}.dblock .dtile.full{grid-column:1/-1}
.card .deliv{margin-top:8px;padding:7px 10px;border-radius:14px;gap:10px}
.card .dthumb{width:46px;height:34px;border-radius:7px;object-fit:cover}
.card .dtxt b{font-size:13px}
.gchip{display:inline-flex;align-items:center;gap:6px;min-width:0}
.gchip b{font-family:var(--num);font-size:12px;background:rgba(255,255,255,.14);border-radius:999px;padding:0 7px;line-height:18px}
.gchip .mi{width:13px;height:13px}
.tposter{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.tp-img{border:0;padding:0;background:none;cursor:zoom-in;width:min(520px,100%)}
.tp-img img{width:100%;display:block;border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.6);border:1px solid #3d3d48}
.tp-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(520px,100%);flex-wrap:wrap}
.tp-bar>span{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}.tp-bar>span b{font-size:20px;color:var(--fg)}.tp-bar img{width:26px}
.ti b{font-size:14px;font-weight:600}
.tmy{display:block;margin-top:10px;margin-inline-start:20%;font-size:13px}
.alumni .left{display:inline-block;margin-inline-start:8px;font-size:12px;font-weight:600;color:#1a1200;background:#f6c22b;border-radius:999px;padding:1px 9px;vertical-align:middle}
.al-lock .mi{width:20px;height:20px;stroke:#e5dbff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fd .25s ease-out}
@keyframes fd{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

  <div class="vstage ${isPdf?"pdf":""}"><img id="vimg" alt="">${total>1?`<button class="vnav vprev" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button><button class="vnav vnext" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>`:""}</div>
  <div class="vbar"><span class="vcount" id="vcount"></span>${isPdf?`<button class="btn small" id="vdl">تحميل الملف ${ICON.ext}</button>`:""}</div>
  ${total>1?`<div class="vthumbs">${Array.from({length:total},(_,k)=>`<button data-k="${k}" aria-label="${k+1}"><img src="${src(k)}" alt=""></button>`).join("")}</div>`:""}
  <p class="vnote">${isPdf?"مستند تجريبي، وفي النسخة الحقيقية ينعرض ملف الـ PDF الفعلي.":"أمثلة تجريبية، وفي النسخة الحقيقية تظهر الشهادات والأعمال الفعلية."}</p>`,"viewer");
 const sc=md.sc,img=sc.querySelector("#vimg");
 const show=k=>{cur=(k+total)%total;img.src=src(cur);sc.querySelector("#vcount").textContent=total>1?`${isPdf?"صفحة":"صورة"} ${cur+1} من ${total}`:"";sc.querySelectorAll(".vthumbs button").forEach((b,j)=>b.setAttribute("aria-current",j===cur))};
 show(cur);
 const pv=sc.querySelector(".vprev"),nx=sc.querySelector(".vnext");if(pv)pv.onclick=()=>show(cur-1);if(nx)nx.onclick=()=>show(cur+1);
 sc.querySelectorAll(".vthumbs button").forEach(b=>b.onclick=()=>show(+b.dataset.k));
 const dl=sc.querySelector("#vdl");if(dl)dl.onclick=()=>toast("مثال تجريبي: في النسخة الحقيقية يتحمّل الملف الفعلي");
 const key=e=>{if(!document.body.contains(sc)){document.removeEventListener("keydown",key);return}if(e.key==="ArrowLeft")show(cur+1);if(e.key==="ArrowRight")show(cur-1)};document.addEventListener("keydown",key);
 let x0=null;const st=sc.querySelector(".vstage");st.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});st.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)show(dx>0?cur+1:cur-1);x0=null});
}
function openOutput(id,kind){
 const it=USERS[S.uid].items.find(i=>i.id===id); if(!it) return;
 if(it.outUrl){ if(kind==="image"){modal(`<img class="lb" src="${esc(it.outUrl)}" alt=""><p>${esc(it.output)}</p>`,"wide")} else window.open(it.outUrl,"_blank","noopener"); return; }
 if(kind==="image"){modal(`<img class="lb" src="${A.banner}" alt=""><p>${esc(it.output)} · صورة تجريبية</p>`,"wide");return}
 toast(`مثال تجريبي: في النسخة الحقيقية يفتح ${kind==="link"?"الرابط":"الملف"} الفعلي`);
}
function saveBlob(blob,name){
 const go=()=>{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)};
 if(window.claude&&window.claude.use){window.claude.use("downloads").then(d=>d?d.save({filename:name,data:blob}):toast("التحميل يشتغل من رابط البوابة على الإنترنت")).catch(()=>{});return}
 go();
}
const today=()=>new Date().toISOString().slice(0,10);
function openExport(){
 const u=USERS[S.uid];
 const m=modal(`<h3 class="mh">تحميل ملف الإنجاز</h3><p class="msub">نسخة ثابتة من إنجازاتك المعتمدة، ما تتعدل. تفيدك في السيرة الذاتية أو لو خلصت عضويتك وتبين تحتفظين بإنجازاتك.</p>
  <div class="xopts"><button class="xopt" id="xpdf"><span class="xi">${ICON.file}</span><span><b>ملف PDF</b><small>تقرير مرتب للطباعة والإرفاق، فيه رمز تحقق يفتح ملفك</small></span></button>
  ${S.solo?"":`<button class="xopt" id="xhtml"><span class="xi">${ICON.link2}</span><span><b>صفحة مستقلة (HTML)</b><small>نسخة من ملفك بنفس التصميم، ترفعينها على حسابك في GitHub وتصير موقعك الخاص</small></span></button>`}</div>`);
 m.sc.querySelector("#xpdf").onclick=()=>{m.close();printReport(u)};

 const h=m.sc.querySelector("#xhtml"); if(h) h.onclick=()=>{m.close();exportHTML()};
}
async function exportHTML(){
 const MS="/*DATA_"+"START*/",ME="/*DATA_"+"END*/";
 try{
  const src=await (await fetch(location.href.split("#")[0],{cache:"no-store"})).text();
  const a=src.indexOf(MS),b=src.indexOf(ME); if(a<0||b<0) throw 0;
  const u=USERS[S.uid];
  const data=`${MS}\nconst DEPT=${JSON.stringify(u.dept)};\nconst USERS=${JSON.stringify({[S.uid]:u})};\nconst SOLO=${JSON.stringify(S.uid)},SNAP=${JSON.stringify(today())};\n`;
  saveBlob(new Blob([src.slice(0,a)+data+src.slice(b)],{type:"text/html"}),"index.html");
  toast("تم تجهيز ملفك index.html، ارفعيه على GitHub بنفس الخطوات");
 }catch(e){toast("الصفحة المستقلة تتحمّل من رابط البوابة على الإنترنت")}
}
function printReport(u){
 const it=u.items.filter(i=>i.approved).sort((a,b)=>itemDate(b).localeCompare(itemDate(a)));
 const st=(u.role==="leader"?leaderStats(u):memberStats(u));
 const titles=u.role==="leader"?[]:u.titles;
 let pa=document.getElementById("printArea"); if(pa) pa.remove();
 pa=document.createElement("div");pa.id="printArea";pa.dir="rtl";
 pa.innerHTML=`<header class="pa-h"><div><div class="pa-brand"><span>AI</span>Club</div><h1>ملف الإنجاز الرقمي</h1><p>${esc(u.name)} · ${esc(u.position)}</p><p class="pa-m">صدر في <span class="date">${fd(today())}</span> · نادي الذكاء الاصطناعي — FCIT</p></div><div class="pa-qr"><div id="paqr"></div><small>امسح للتحقق</small></div></header>
 <section class="pa-stats">${st.map(s=>`<div><small>${esc(s.lab)}</small><b>${s.val}</b>${s.brk?`<em>${s.brk.map(([l,n])=>`${l} ${n}`).join(" · ")}</em>`:""}</div>`).join("")}</section>
 <h2>الإنجازات المعتمدة (${it.length})</h2>
 ${it.length?`<table class="pa-t"><thead><tr><th>النوع</th><th>الإنجاز</th><th>التاريخ</th><th>التفاصيل</th></tr></thead><tbody>${it.map(i=>`<tr><td>${TYPE_LABEL[i.type]}</td><td><b>${esc(i.title)}</b>${i.output?`<div class="pa-o">المخرج: ${esc(i.output)}</div>`:""}</td><td><span class="date">${fd(itemDate(i))}</span></td><td>${[i.forDept&&("لصالح "+esc(i.forDept)),i.team&&("فريق من "+i.team),i.result&&("النتيجة: "+esc(i.result)),i.organizer&&esc(i.organizer),i.impact&&("الأثر: "+esc(i.impact)),i.ratings&&("التقييم: "+i.ratings.join(" / ")+" من 5")].filter(Boolean).join(" · ")}</td></tr>`).join("")}</tbody></table>`:`<p class="pa-e">لا توجد إنجازات معتمدة بعد.</p>`}
 ${titles.length?`<h2>ألقاب التميز (${titles.length})</h2><ul class="pa-ti">${titles.map(x=>`<li><img src="${A[x.img]}" alt=""><span><b>${esc(x.t)}</b><span class="date">${my(x.d)}</span></span></li>`).join("")}</ul>`:""}
 <footer class="pa-f">#نقود_المستقبل · هذا الملف صادر من بوابة الإنجاز الرقمي، وكل الإنجازات فيه معتمدة من قادة الأقسام.</footer>`;
 document.body.appendChild(pa);
 try{new QRCode(pa.querySelector("#paqr"),{text:(SHARE_BASE||location.href.split("#")[0])+"#u"+S.uid,width:220,height:220,colorDark:"#111111",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){}
 setTimeout(()=>{try{window.print()}catch(e){} toast("اختاري «حفظ كـ PDF» من نافذة الطباعة")},450);
}

/* ---------- الأحداث ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo({top:0,behavior:"smooth"});return}
 if(t.dataset.go){S.tab=t.dataset.go;render();return}
 if(t.dataset.filter){S.filter[t.dataset.filter]=t.dataset.v;render();return}
 if(t.dataset.toggle){S.open[t.dataset.toggle]=!S.open[t.dataset.toggle];render();return}
 if(t.id==="share"){openShare();return}
 if(t.dataset.exp){S.exp[t.dataset.exp]=!S.exp[t.dataset.exp];render();return}
 if(t.dataset.title!==undefined){openTitle(+t.dataset.title);return}
 if(t.dataset.media){openMedia(t.dataset.media,+t.dataset.i||0);return}
 if(t.dataset.out){openOutput(t.dataset.out,t.dataset.kind);return}
 if(t.id==="export"||t.id==="export2"){openExport();return}
 if(t.dataset.exitcert){openExitCert();return}
 if(t.id==="tpdl"){saveBlob(dataUrlBlob(titlesPoster(USERS[S.uid])),"titles-"+S.uid+".jpg");return}
 if(t.id==="tpview"){const u=USERS[S.uid];const md=modal(`<div class="vhead"><h3>ألقاب التميز</h3></div><div class="vstage"><img src="${titlesPoster(u)}" alt=""></div>${S.publicView?"":`<div class="vbar"><span class="vnote">صورة جاهزة للمشاركة</span><button class="btn small" id="tpdl2">تحميل الصورة ${ICON.ext}</button></div>`}`,"viewer");const d2=md.sc.querySelector("#tpdl2");if(d2)d2.onclick=()=>saveBlob(dataUrlBlob(titlesPoster(u)),"titles-"+S.uid+".jpg");return}
 if(t.id==="logout"){S.uid=null;S.filter={};S.open={};S.month="all";store.set("portal_uid",null);render();return}
});
document.addEventListener("change",e=>{if(e.target.id==="month"){S.month=e.target.value;render()}
 if(e.target.id==="switch"){S.uid=e.target.value;S.tab="home";S.filter={};S.open={};S.month="all";store.set("portal_uid",S.uid);render();window.scrollTo({top:0})}});

/* ---------- البدء ---------- */
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{IMGC.clear();if(S.uid&&!document.querySelector(".scrim"))render()});
(function start(){
 if(SOLO&&USERS[SOLO]){S.uid=SOLO;S.solo=true;const pv=document.querySelector(".preview");if(pv)pv.remove();render();return}
 const m=(location.hash||"").match(/^#u(\d+)$/);
 if(m&&USERS[m[1]]){S.uid=m[1];S.publicView=true}
 else{const s=store.get("portal_uid");if(s&&USERS[s])S.uid=s}
 render();
})();
</script>

</body>
